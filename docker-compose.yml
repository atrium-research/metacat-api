name: metacat

services:
  api:
    container_name: metacat-api
    build:
      tags:
        - "metacat-api:${VERSION:?}"
        - "metacat-api:latest"
      context: .
      args:
        VERSION: ${VERSION:?}
    ports:
      - "8000:8000"
    environment:
      JSON_DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:?}
      API_KEYS: ${API_KEYS:?}
      GIT_USERNAME: ${GIT_USERNAME:?}
      GIT_PASSWORD: ${GIT_PASSWORD:?}
    volumes:
      - data:/data
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 2s
      retries: 10
    develop:
      watch:
        - path: ./src
          action: rebuild
volumes:
  data:
     driver: local
     driver_opts:
       type: none
       o: bind
       device: "${PWD}/${JSON_DATA_DIR:?}"
