name: metacat

services:
  api:
    build:
      tags:
        - "metacat-api:${VERSION:?}"
        - "metacat-api:latest"
      context: .
      args:
        VERSION: ${VERSION:?}
    ports:
      - "8000:8000"
    environment:
      JSON_DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:?}
      API_KEYS: ${API_KEYS:?}
    volumes:
      - ${JSON_DATA_DIR:?}:/data
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 2s
      retries: 10
    develop:
      watch:
        - path: ./src
          action: rebuild