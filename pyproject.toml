[project]
name = "metacat-api"
dynamic = ["version"]
description = "REST API serving the MetaCat catalogue-of-catalogues dashboard for ATRIUM."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Foxcub", email = "julien.homo@foxcub.fr" }]
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "jq>=1.12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
    "anyio>=4.14.1",
    "gitpython>=3.1.58",
    "aiohttp>=3.14.3",
    "fastapi-pagination>=0.15.16",
    "rdflib>=7.6.0",
    "cachetools>=7.1.8",
    "cachetools-async>=0.0.5",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx2>=2.7.0",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/atrium-research/metacat-api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "env"
variable = "VERSION"

[tool.hatch.build.targets.wheel]
packages = ["src/metacat_api"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
