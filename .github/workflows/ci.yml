name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - run: |
          set -a && source .env.example && set +a
          uv lock --check
          uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: |
          cp .env.example .env
          uv run pytest
